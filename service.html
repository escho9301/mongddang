<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>몽땅식탁</title>
    <!-- 옛 주소로 들어온 방문자를 새 주소로 넘긴다. 검색에는 새 주소만 남기려고 noindex 를 둔다.
         .html 파일이 같은 이름의 디렉터리보다 먼저 응답하므로 /service 도 여기서 처리된다. -->
    <link rel="canonical" href="https://www.mongddangsigtag.com/service/online">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=/service/online">
    <script>location.replace("/service/online" + location.search + location.hash);</script>
</head>
<body>
    <p style="font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;padding:40px;text-align:center;">
        주소가 바뀌었습니다. 자동으로 이동합니다 — <a href="/service/online">/service/online</a>
    </p>
</body>
</html>
