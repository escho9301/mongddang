name: 인스타그램 액세스 토큰 자동 갱신

# 인스타 장기 토큰은 60일이면 만료된다(발급 24시간 후부터 갱신 가능, 갱신하면 다시 60일).
# 만료되면 피드 갱신이 조용히 멈추고, 되살리려면 Meta 개발자 콘솔에서 OAuth를 처음부터
# 다시 타야 한다. 그래서 주 1회 미리 갱신해 만료 자체가 오지 않게 한다.
#
# 필요한 시크릿 2개:
#   IG_TOKEN      — 인스타 장기 액세스 토큰 (이 잡이 매주 새 값으로 덮어씀)
#   IG_SECRET_PAT — 위 시크릿을 쓰기 위한 GitHub PAT(Fine-grained, 이 리포의 Secrets: Read and write)
#                   기본 GITHUB_TOKEN 으로는 시크릿을 쓸 수 없어 별도 PAT이 필요하다.

on:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 03:17 UTC (= 화요일 12:17 KST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-token
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 장기 토큰 갱신 후 시크릿 덮어쓰기
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.IG_SECRET_PAT }}
        run: |
          set -euo pipefail

          # 아직 인스타 연동 전이면 조용히 건너뛴다.
          # 여기서 실패시키면 설정을 미루는 동안 매주 실패 알림이 날아온다.
          # 반대로 "설정은 됐는데 갱신이 실패"하는 경우는 아래에서 크게 실패시킨다 — 그건 진짜 문제다.
          if [[ -z "${IG_TOKEN:-}" ]]; then
            echo "⏭  IG_TOKEN 시크릿이 아직 없음 — 인스타 연동 전이므로 건너뜀"
            echo "   연동하려면 scripts/README.md 참고"
            exit 0
          fi

          RESP=$(curl -sS -G "https://graph.instagram.com/refresh_access_token" \
                   --data-urlencode "grant_type=ig_refresh_token" \
                   --data-urlencode "access_token=$IG_TOKEN")

          NEW=$(printf '%s' "$RESP" | jq -r '.access_token // empty')
          if [[ -z "$NEW" ]]; then
            # 응답 전체에는 토큰이 담길 수 있으므로 error 필드만 찍는다
            echo "❌ 토큰 갱신 실패: $(printf '%s' "$RESP" | jq -c '.error // "알 수 없는 오류"')"
            echo "   이미 만료됐다면 Meta 개발자 콘솔에서 새 장기 토큰을 발급해 IG_TOKEN 을 교체해야 합니다."
            exit 1
          fi
          echo "::add-mask::$NEW"

          gh secret set IG_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"

          DAYS=$(( $(printf '%s' "$RESP" | jq -r '.expires_in // 0') / 86400 ))
          echo "✅ 토큰 갱신 완료 — 약 ${DAYS}일 유효"
