name: 홈 인스타그램 최신 게시물 자동 갱신

on:
  schedule:
    - cron: "30 */6 * * *"   # 6시간마다(UTC) 최신 게시물 확인 — 유튜브 잡과 30분 어긋나게 둔다
  workflow_dispatch:          # 필요 시 수동 실행
  push:
    branches: [main]
    paths:                    # 스크립트/워크플로 수정 시 즉시 한번 반영
      - "scripts/fetch-instagram.mjs"
      - ".github/workflows/instagram.yml"

permissions:
  contents: write

concurrency:
  group: instagram-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 인스타 API에서 최신 게시물 반영
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          # 스크립트가 썸네일을 정사각형 WebP(690/320)로 줄일 때 ImageMagick 을 쓴다(없으면 원본 JPG).
          # 토큰이 없으면 스크립트가 바로 끝나므로 그때는 설치도 건너뛴다.
          if [[ -n "${IG_TOKEN:-}" ]] && ! command -v magick >/dev/null && ! command -v convert >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi
          node scripts/fetch-instagram.mjs

      - name: 변경분 커밋 & 푸시
        run: |
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- index.html 'img/ig-*'   # 따옴표: git 패턴이라 삭제된 예전 JPG 도 잡힌다
            git commit -m "chore: 홈 인스타그램 최신 게시물 자동 갱신 [skip ci]"
            git push
            echo "✅ 최신 게시물로 갱신·배포됨"
          else
            echo "변경 없음 — 커밋 생략"
          fi
